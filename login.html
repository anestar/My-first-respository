<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <form action="" method="get">
            <label for="username"><b>Username</b></label>
            <input type="text" placeholder="Enter your firstname" name="firstname" id="fname" required>

            <label for="email"><b>Email</b></label>
            <input type="text" placeholder="Enter your email" name="email" id="email" required>

            <label for="password"><b>Password</b></label>
            <input type="text" placeholder="Enter your password" name="password" id="fname" required>

            <label for="cpassword"><b> Confirm Password</b></label>
            <input type="text" placeholder="Confirm your password" name="cpassword" id="cpassword" required>

            <button type="submit" class="registerbtn">LOGIN</button>
    </form>
</body>
</html>
